name: Build, test and publish container
on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: flashback-lab:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container and check HTTP
        run: |
          docker run -d --name flashback-test --read-only --tmpfs /tmp:rw,size=64m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true -p 127.0.0.1:10101:8080 flashback-lab:test
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:10101/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:10101/healthz
          curl -fsSI http://127.0.0.1:10101/braids.wasm | grep -i 'content-type: application/wasm'
          test "$(docker exec flashback-test id -u)" != 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test AudioWorklet on localhost
        run: node tools/browser-test.mjs
        env:
          LAB_TEST_URL: http://127.0.0.1:10101
          LAB_EXPECT_BACKEND: worklet
      - name: Test plain HTTP LAN compatibility
        run: node tools/browser-test.mjs
        env:
          LAB_TEST_URL: http://flashback.test:10101
          LAB_EXPECT_BACKEND: compatibility
          LAB_HOST_RESOLVER: MAP flashback.test 127.0.0.1
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs flashback-test || true
          docker rm -f flashback-test || true
  publish:
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
